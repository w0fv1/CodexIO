server:
  host: 127.0.0.1
  port: 8787
  publicUrl: http://127.0.0.1:8787
proxy:
  enabled: true
  http: http://127.0.0.1:7890
  https: http://127.0.0.1:7890
  socks: socks5://127.0.0.1:7890
  noProxy:
    - localhost
    - 127.0.0.1
defaultAgent: echo
agents:
  echo:
    enabled: true
    command: echo
    args: []
    autoLoadSkill: false
    env: {}
  codex:
    enabled: true
    command: codex
    args: []
    autoLoadSkill: true
    env:
      HTTP_PROXY: ${proxy.http}
      HTTPS_PROXY: ${proxy.https}
      ALL_PROXY: ${proxy.socks}
channels:
  web:
    enabled: true
  cli:
    enabled: true
workspaces:
  default:
    path: .
    defaultAgent: echo
    allowedChannels:
      - web
      - cli
routing:
  defaultWorkspace: default
  repoCommand: /repo
messaging:
  maxOutboundChars: 1800
  maxOutboundPerMinute: 3
  allowMarkdown: true
security:
  blockSecrets: true
